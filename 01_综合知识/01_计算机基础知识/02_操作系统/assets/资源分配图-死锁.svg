<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill:#111827; }
      .title { font-size:34px; font-weight:700; fill:#173b75; }
      .sub { font-size:20px; fill:#334155; }
      .label { font-size:22px; font-weight:600; }
      .small { font-size:18px; fill:#334155; }
      .proc { fill:#dff4df; stroke:#245c2a; stroke-width:2; }
      .res { fill:#e7f0fb; stroke:#315f8e; stroke-width:2; }
      .req { stroke:#111827; stroke-width:4; fill:none; marker-end:url(#arrowBlack); }
      .alloc { stroke:#2563eb; stroke-width:4; fill:none; marker-end:url(#arrowBlue); }
      .legend { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.5; }
      .conclusion { fill:#fff8df; stroke:#d4a72c; stroke-width:1.5; }
    </style>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="48" y="58" class="title">资源分配图：用“请求”和“已分配”看死锁</text>
  <text x="48" y="98" class="sub">圆形 = 进程；方框 = 资源。P → R 表示请求，R → P 表示已分配。</text>

  <rect x="720" y="118" width="420" height="112" rx="14" class="legend"/>
  <line x1="760" y1="158" x2="850" y2="158" class="req"/>
  <text x="875" y="166" class="small">P → R：进程请求资源</text>
  <line x1="760" y1="200" x2="850" y2="200" class="alloc"/>
  <text x="875" y="208" class="small">R → P：资源已分配给进程</text>

  <text x="48" y="165" class="label">例：P1 占有 R1、请求 R2；P2 占有 R2、请求 R1</text>

  <circle cx="300" cy="390" r="54" class="proc"/>
  <text x="274" y="400" class="label">P1</text>

  <rect x="525" y="250" width="150" height="100" rx="6" class="res"/>
  <text x="568" y="295" class="label">R2</text>
  <text x="548" y="325" class="small">1 个实例</text>

  <circle cx="900" cy="390" r="54" class="proc"/>
  <text x="874" y="400" class="label">P2</text>

  <rect x="525" y="465" width="150" height="100" rx="6" class="res"/>
  <text x="568" y="510" class="label">R1</text>
  <text x="548" y="540" class="small">1 个实例</text>

  <line x1="348" y1="363" x2="525" y2="307" class="req"/>
  <text x="380" y="305" class="small">请求 R2</text>

  <line x1="675" y1="316" x2="852" y2="365" class="alloc"/>
  <text x="710" y="295" class="small">已分配给 P2</text>

  <line x1="852" y1="417" x2="675" y2="505" class="req"/>
  <text x="760" y="500" class="small">请求 R1</text>

  <line x1="525" y1="515" x2="348" y2="417" class="alloc"/>
  <text x="330" y="525" class="small">已分配给 P1</text>

  <rect x="48" y="600" width="1092" height="82" rx="12" class="conclusion"/>
  <text x="70" y="632" class="label" fill="#173b75">结论：</text>
  <text x="165" y="632" class="small">单实例资源：图中有环 ⇔ 死锁；多实例资源：有环不一定死锁，还要继续做安全性分析。</text>
  <text x="70" y="665" class="small">一句话：资源分配图里的“环”是死锁的重要信号，单实例资源时尤其关键。</text>
</svg>