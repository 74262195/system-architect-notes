name: recover-software-notes-once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-software-notes-once.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover notes from checkpoint draft
        run: python scripts/recover_software_notes_once.py
      - name: Validate vault
        run: node scripts/check-vault.mjs
      - name: Commit recovered notes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: restore software engineering notes and continue security audit'
          for n in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 2
          done
          exit 1
