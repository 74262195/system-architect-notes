name: Extract textbook text

on:
  push:
    branches:
      - main
    paths:
      - "02、最新教材-新大纲(第二版)/*.pdf"
      - "scripts/extract-textbook-text.py"
      - ".github/workflows/extract-textbook-text.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: textbook-text-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository without all LFS objects
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install extraction tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs poppler-utils tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng

      - name: Pull textbook LFS objects only
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="02、最新教材-新大纲(第二版)/*.pdf" --exclude=""

      - name: Extract textbooks into AI-readable Markdown
        id: extract
        shell: bash
        run: |
          set +e
          python3 scripts/extract-textbook-text.py --ocr-fallback --ocr-workers 2 --ocr-dpi 180
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Validate generated Markdown
        shell: bash
        run: |
          node scripts/check-vault.mjs
          git diff --check

      - name: Commit generated textbook layer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- "02、最新教材-新大纲(第二版)/AI教材库"

          if git diff --cached --quiet; then
            echo "No generated textbook changes."
            exit 0
          fi

          git commit -m "docs: refresh AI-readable textbook text"

          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              pushed=1
              break
            fi
            git rebase --abort || true
            sleep 2
          done

          if [ "$pushed" -ne 1 ]; then
            echo "Failed to push generated textbook text after retries." >&2
            exit 1
          fi

      - name: Fail if extraction had hard errors
        if: steps.extract.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Textbook extraction reported hard failures. Check AI教材库/抽取报告.md." >&2
          exit 1
