  <text fill="#172033" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="650" text-anchor="middle"><tspan x="545" y="365.78000000000003">1｜5000｜500B</tspan></text>
  <rect x="430" y="420" width="230" height="64" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" opacity="1"/>
  <text fill="#172033" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="650" text-anchor="middle"><tspan x="545" y="455.78000000000003">2｜9000｜300B</tspan></text>
  <text fill="#475569" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="545" y="535.96">基址：段在物理内存的起点</tspan><tspan x="545" y="556.76">段长：允许的段内偏移范围</tspan></text>
