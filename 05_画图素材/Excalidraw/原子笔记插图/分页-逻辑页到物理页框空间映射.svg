  <text fill="#172033" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="650" text-anchor="middle"><tspan x="500" y="245.78">页 0  →  页框 1</tspan></text>
