<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="332" viewBox="0 0 1040 332" role="img" aria-labelledby="title desc">
  <title id="title">霍尔三维结构的时间维</title>
  <desc id="desc">规划、拟定方案、研制、生产、安装、运行、更新七个阶段组成的两行折返流程</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      .stage { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .turn { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
      .label { fill: #1f2937; font: 500 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.25; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="stage" x="40" y="40" width="180" height="72" rx="14"/>
  <text class="label" x="130" y="76">规划</text>

  <rect class="stage" x="300" y="40" width="180" height="72" rx="14"/>
  <text class="label" x="390" y="76">拟定方案</text>

  <rect class="stage" x="560" y="40" width="180" height="72" rx="14"/>
  <text class="label" x="650" y="76">研制</text>

  <rect class="stage" x="820" y="40" width="180" height="72" rx="14"/>
  <text class="label" x="910" y="76">生产</text>

  <rect class="stage" x="300" y="220" width="180" height="72" rx="14"/>
  <text class="label" x="390" y="256">更新</text>

  <rect class="stage" x="560" y="220" width="180" height="72" rx="14"/>
  <text class="label" x="650" y="256">运行</text>

  <rect class="turn" x="820" y="220" width="180" height="72" rx="14"/>
  <text class="label" x="910" y="256">安装</text>

  <path class="flow" d="M220 76 H292"/>
  <path class="flow" d="M480 76 H552"/>
  <path class="flow" d="M740 76 H812"/>
  <path class="flow" d="M910 112 V212"/>
  <path class="flow" d="M820 256 H748"/>
  <path class="flow" d="M560 256 H488"/>
</svg>
